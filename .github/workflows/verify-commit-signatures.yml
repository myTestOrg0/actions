name: Verify commit signatures

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify commit signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify introduced commits
        # TODO: Replace with the full SHA of the commit containing this implementation.
        uses: lidofinance/actions/.github/actions/verify-commit-signatures@f43d0afe5f556f047f7c709b5a67aa45c2a9c1b2
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
