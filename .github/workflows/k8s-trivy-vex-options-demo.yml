# DEMO (test org only): one image, scanned once per VEX whitelisting option.
#
#   Baseline  no VEX
#   A         global VEX repository (`internal` = myTestOrg0/vex-scope-demo, as is)
#   B         image statements (pkg:oci + next as subcomponent), image pushed to a
#             registry on the runner under the prod hostname and scanned from there
#   C         same repository as A, filtered by `scope-vex` (whitelist_repositories/expires)
#   D         central per-repo OpenVEX file: options/d-vex/repos/<caller repo>/vex.json
#   E         central per-repo ignore file: options/e-trivyignore/repos/<caller repo>.trivyignore.yaml
#
# Only `internal` is configured (no DHI / VEX Hub) so every result comes from our data.
# The "Result" step compares each option with the expected outcome and fails on a mismatch.
name: K8s Trivy VEX options demo

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name the caller claims (used only by option B)
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: Options A-E (image ${{ inputs.image_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      PROD_HOST: registry.prod.k8s-prod.org
      IMAGE_NAME: ${{ inputs.image_name }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: Checkout test VEX data (myTestOrg0/vex-scope-demo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myTestOrg0/vex-scope-demo
          path: vexdata
          persist-credentials: false

      - name: "0. Prepare: build image, install Trivy, download DB"
        run: |
          set -euo pipefail
          [[ "$IMAGE_NAME" =~ ^[a-z0-9-]+$ ]] || { echo "bad image_name"; exit 1; }
          T="$RUNNER_TEMP/t"; mkdir -p "$T/base"; echo "T=$T" >> "$GITHUB_ENV"
          echo "Caller repository: $GITHUB_REPOSITORY   image_name input: $IMAGE_NAME"
          docker build -q -t local-build:demo app
          docker save -o "$T/image.tar" local-build:demo
          curl -fsSLo "$T/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $T/trivy.tgz" | sha256sum -c -
          tar xzf "$T/trivy.tgz" -C "$T" trivy && sudo install -m 0755 "$T/trivy" /usr/local/bin/trivy
          trivy image --cache-dir "$T/base" --download-db-only -q
          mkdir -p "$HOME/.trivy/vex"
          cat > "$HOME/.trivy/vex/repository.yaml" <<'YAML'
          repositories:
            - name: internal
              url: https://github.com/myTestOrg0/vex-scope-demo
              enabled: true
          YAML
          # scan.sh <name> <cache dir> <trivy image args...>: JSON report + readable verdict
          cat > "$T/scan.sh" <<'SH'
          set -euo pipefail
          name=$1 cache=$2; shift 2
          cd "$T"
          trivy image -q --cache-dir "$cache" --skip-db-update --scanners vuln --pkg-types os,library \
            --show-suppressed --format json -o "$T/r-$name.json" "$@"
          python3 "$T/show.py" "$T/r-$name.json"
          SH
          cat > "$T/show.py" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          for g in ("GHSA-2xp9-vwfh-vxw4", "GHSA-2464-fhr4-w9xw"):
              line = f"{g}  next: not in image"
              for res in r.get("Results") or []:
                  for v in res.get("Vulnerabilities") or []:
                      if v["VulnerabilityID"] == g:
                          line = f"{g}  next@{v['InstalledVersion']}  REPORTED"
                  for m in res.get("ExperimentalModifiedFindings") or []:
                      if m["Finding"]["VulnerabilityID"] == g:
                          line = f"{g}  next@{m['Finding']['InstalledVersion']}  HIDDEN ({m['Status']}) by {m['Source']}"
              print(line)
          PY

      - name: "Baseline: no VEX"
        run: bash "$T/scan.sh" base "$T/base" --input "$T/image.tar"

      - name: "A. Global VEX repository (as today)"
        run: |
          set -euo pipefail
          cp -a "$T/base" "$T/A"
          trivy vex repo download --cache-dir "$T/A" -q
          echo "Statements in the downloaded repository (no filtering):"
          jq -r '.statements[] | "  \(.vulnerability.name)  \(.products[0]["@id"])  repos=\(.whitelist_repositories)  expires=\(.whitelist_expires)"' \
            "$T/A/vex/repositories/internal/0.1/pkg/npm/next/vex.json"
          bash "$T/scan.sh" A "$T/A" --input "$T/image.tar" --vex repo --skip-vex-repo-update

      - name: "B. Image statements + registry on the runner"
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/t/certs/tls.crt
        run: |
          set -euo pipefail
          # registry on 127.0.0.1:443 answering as the prod hostname
          mkdir -p "$T/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$PROD_HOST" \
            -addext "subjectAltName=DNS:$PROD_HOST" -keyout "$T/certs/tls.key" -out "$T/certs/tls.crt" 2>/dev/null
          echo "127.0.0.1 $PROD_HOST" | sudo tee -a /etc/hosts >/dev/null
          sudo mkdir -p "/etc/docker/certs.d/$PROD_HOST" && sudo cp "$T/certs/tls.crt" "/etc/docker/certs.d/$PROD_HOST/ca.crt"
          docker run -d -q --name reg443 -p 443:443 -v "$T/certs:/certs:ro" -e REGISTRY_HTTP_ADDR=0.0.0.0:443 \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/tls.crt -e REGISTRY_HTTP_TLS_KEY=/certs/tls.key registry:2 >/dev/null
          sleep 2
          ref="$PROD_HOST/team-si/$IMAGE_NAME:test"
          docker tag local-build:demo "$ref" && docker push -q "$ref" >/dev/null
          # VEX repository with only the image statements (options/b-oci)
          cp -a "$T/base" "$T/B"
          mkdir -p "$T/B/vex/repositories/internal/0.1" && cp -r vexdata/options/b-oci/. "$T/B/vex/repositories/internal/0.1/"
          echo "Index key in the VEX repository: $(jq -r '.packages[0].id' vexdata/options/b-oci/index.json)"
          trivy image -q --cache-dir "$T/B" --skip-db-update --scanners vuln --format cyclonedx -o "$T/bom-B.json" --image-src remote "$ref"
          echo "Image PURL built by Trivy:      $(jq -r '.metadata.component.purl' "$T/bom-B.json")"
          bash "$T/scan.sh" B "$T/B" --image-src remote "$ref" --vex repo --skip-vex-repo-update

      - name: "C. prepare: copy repository A"
        run: cp -a "$T/A" "$T/C"

      - name: "C. scope-vex filter (whitelist_repositories / whitelist_expires)"
        uses: myTestOrg0/actions/.github/actions/k8s-harbor-helper@feat/vex-scope-filter
        with:
          command: scope-vex
        env:
          VEX_CACHE_DIR: ${{ runner.temp }}/t/C

      - name: "C. scan with the filtered repository"
        run: bash "$T/scan.sh" C "$T/C" --input "$T/image.tar" --vex repo --skip-vex-repo-update

      - name: "D. Central per-repo VEX file"
        run: |
          set -euo pipefail
          f="vexdata/options/d-vex/repos/$GITHUB_REPOSITORY/vex.json"
          args=()
          if [ -f "$f" ]; then echo "Using $f"; args=(--vex "$PWD/$f"); else echo "No file $f -> no exceptions for $GITHUB_REPOSITORY"; fi
          bash "$T/scan.sh" D "$T/base" --input "$T/image.tar" "${args[@]}"

      - name: "E. Central per-repo .trivyignore.yaml"
        run: |
          set -euo pipefail
          f="vexdata/options/e-trivyignore/repos/$GITHUB_REPOSITORY.trivyignore.yaml"
          args=()
          if [ -f "$f" ]; then echo "Using $f"; cat "$f"; args=(--ignorefile "$PWD/$f"); else echo "No file $f -> no exceptions for $GITHUB_REPOSITORY"; fi
          bash "$T/scan.sh" E "$T/base" --input "$T/image.tar" "${args[@]}"

      - name: Result
        run: |
          python3 - <<'PY'
          import json, os
          T, repo, image = os.environ["T"], os.environ["GITHUB_REPOSITORY"], os.environ["IMAGE_NAME"]
          G = ["GHSA-2xp9-vwfh-vxw4", "GHSA-2464-fhr4-w9xw"]
          # expected: H = hidden, R = reported, for (GHSA-2xp9, GHSA-2464)
          esw = repo == "myTestOrg0/ethereum-staking-widget-1"
          vault = repo == "myTestOrg0/staking-vault-widget"
          expected = {
              "base": "RR",
              "A": "HH",
              "B": "HH" if image == "staking-widget" else "RR",
              "C": "HR" if esw else "RH" if vault else "RR",
              "D": "HH" if esw else "RR",
              "E": "HR" if esw else "RR",
          }
          labels = {"base": "Baseline: no VEX", "A": "A. Global VEX", "B": "B. Image statements + registry",
                    "C": "C. scope-vex filter", "D": "D. Central per-repo VEX", "E": "E. Central per-repo .trivyignore.yaml"}
          def state(name, g):
              r = json.load(open(f"{T}/r-{name}.json"))
              for res in r.get("Results") or []:
                  if any(v["VulnerabilityID"] == g for v in res.get("Vulnerabilities") or []):
                      return "R", "reported"
                  for m in res.get("ExperimentalModifiedFindings") or []:
                      if m["Finding"]["VulnerabilityID"] == g:
                          return "H", f"hidden by {m['Source'].replace(T + '/', '').replace(os.getcwd() + '/', '')}"
              return "-", "not in image"
          rows = [f"## VEX options test: `{repo}`, image name `{image}`", "",
                  "| Option | GHSA-2xp9-vwfh-vxw4 | GHSA-2464-fhr4-w9xw | expected | |", "|---|---|---|---|---|"]
          ok = True
          for k, label in labels.items():
              got = [state(k, g) for g in G]
              code = "".join(s for s, _ in got)
              good = code == expected[k]
              ok &= good
              cell = lambda s, t: ("🟢 " if s == "H" else "🔴 " if s == "R" else "") + t
              exp = " / ".join("hidden" if c == "H" else "reported" for c in expected[k])
              rows.append(f"| {label} | {cell(*got[0])} | {cell(*got[1])} | {exp} | {'✅' if good else '❌'} |")
          rows += ["", f"**TEST: {'PASS' if ok else 'FAIL'}**"]
          text = "\n".join(rows)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text + "\n")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vex-options-${{ inputs.image_name }}
          path: ${{ runner.temp }}/t/*.json
          if-no-files-found: warn
