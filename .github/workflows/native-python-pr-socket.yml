# TEMPORARY PROBE: what does a runner hold when this workflow is started from an
# organization ruleset, before any checkout step?
name: Socket

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Socket dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show what is on the runner without a checkout step
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REACHABILITY_VAR: ${{ vars.SOCKET_REACHABILITY }}
        run: |
          echo "repository:   $GITHUB_REPOSITORY"
          echo "workflow_ref: $WORKFLOW_REF"
          echo "workflow_sha: $WORKFLOW_SHA"
          echo "vars.SOCKET_REACHABILITY: '${REACHABILITY_VAR}'"
          echo "--- workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          echo "--- /home/runner/work (depth 3)"
          find /home/runner/work -maxdepth 3 | head -50
          echo "--- search for the lock file and for this workflow file"
          find / -xdev \( -name 'socket-python-cli.lock' -o -name 'native-python-pr-socket.yml' \) 2>/dev/null || true
          echo "--- search done"
